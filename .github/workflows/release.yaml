name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Upload release assets.
      contents: write
      # Sign the build provenance attestation.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check tag
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! $TAG =~ $pattern ]]; then
            echo "::error::tag '$TAG' is not a semver version (vX.Y.Z)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      - run: task qa
      - run: task dist VERSION="$TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/skb-linux-amd64
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/skb-linux-amd64 dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
