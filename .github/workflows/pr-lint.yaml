name: PR lint

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The action reads the commits through the API; the checkout provides the config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  branch:
    name: Branch name
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert|renovate)/[a-z0-9][a-z0-9._/-]*$'
          if [[ ! $BRANCH =~ $pattern ]]; then
            echo "::error::branch '$BRANCH' does not match $pattern"
            exit 1
          fi
