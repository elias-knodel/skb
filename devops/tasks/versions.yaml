version: '3'

tasks:
  list:
    desc: Show the tool versions
    silent: true
    cmds:
      - printf '%-16s %s\n' 'go' '{{.GO_VERSION}}'
      - printf '%-16s %s\n' 'golangci-lint' '{{.GOLANGCI_LINT_VERSION}}'
      - printf '%-16s %s\n' 'govulncheck' '{{.GOVULNCHECK_VERSION}}'
      - printf '%-16s %s\n' 'gotestsum' '{{.GOTESTSUM_VERSION}}'

  go:
    desc: Print the pinned Go version
    silent: true
    cmds:
      - printf '%s\n' '{{.GO_VERSION}}'

  golangci-lint:
    desc: Print the pinned golangci-lint version
    silent: true
    cmds:
      - printf '%s\n' '{{.GOLANGCI_LINT_VERSION}}'

  govulncheck:
    desc: Print the pinned govulncheck version
    silent: true
    cmds:
      - printf '%s\n' '{{.GOVULNCHECK_VERSION}}'

  gotestsum:
    desc: Print the pinned gotestsum version
    silent: true
    cmds:
      - printf '%s\n' '{{.GOTESTSUM_VERSION}}'
